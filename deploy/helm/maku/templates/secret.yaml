{{- if not .Values.database.existingSecret }}
# Database passwords. Created only when database.existingSecret is empty.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maku.dbSecretName" . }}
  labels:
    {{- include "maku.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-password: {{ .Values.database.password | quote }}
  mysql-root-password: {{ .Values.database.rootPassword | quote }}
{{- end }}
