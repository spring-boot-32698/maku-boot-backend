apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maku.fullname" . }}-backend
  labels:
    {{- include "maku.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  {{- if .Values.backend.uploads.enabled }}
  # A ReadWriteOnce volume can't be mounted by old and new pod on different nodes at once
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "maku.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "maku.selectorLabels" (dict "ctx" . "component" "backend") | nindent 8 }}
      annotations:
        # Roll the pods when config changes (env vars are only read at container start)
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.backend.waitForDatabase }}
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "maku.mysqlHost" . }} {{ include "maku.mysqlPort" . }}; do echo waiting for mysql; sleep 2; done"]
      {{- end }}
      containers:
        - name: backend
          image: {{ include "maku.image" (dict "ctx" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "maku.fullname" . }}-backend
          env:
            - name: SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "maku.dbSecretName" . }}
                  key: mysql-password
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if .Values.backend.uploads.enabled }}
          volumeMounts:
            - name: uploads
              mountPath: /app/upload
          {{- end }}
      {{- if .Values.backend.uploads.enabled }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "maku.fullname" . }}-uploads
      {{- end }}
