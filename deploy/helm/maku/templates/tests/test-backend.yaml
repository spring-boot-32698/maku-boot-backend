# `helm test <release>` runs this pod; it passes if the backend reports ready.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "maku.fullname" . }}-test-backend
  labels:
    {{- include "maku.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget", "-qO-", "http://{{ include "maku.fullname" . }}-backend:{{ .Values.backend.service.port }}/actuator/health/readiness"]
