# Lab E
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-e
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab-e }
  template:
    metadata:
      labels: { app: lab-e }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lab-e
spec:
  selector: { app: lab-e }
  ports:
    - port: 80
      targetPort: http
