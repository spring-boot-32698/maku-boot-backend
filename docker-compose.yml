# Backend stack: MySQL + Redis (+ the maku-boot API on http://localhost:8080)
#
# Two ways to use this file:
#
# 1) Debug the backend in IntelliJ, dependencies in Docker (default):
#      docker compose up -d
#    → only mysql (localhost:3306) and redis (localhost:6379) start.
#    Then run net.maku.ServerApplication from IntelliJ (run config ".run/ServerApplication (dev).run.xml",
#    profile dev). application-dev.yml already points at localhost:3306 / localhost:6379.
#
# 2) Run the whole backend in Docker:
#      docker compose --profile app up -d --build
#    → mysql + redis + maku-boot. (Or set COMPOSE_PROFILES=app once in your shell.)
#    The container also listens for a debugger on localhost:5005 (IntelliJ "Remote JVM Debug").
#
# Don't run both at once: the IntelliJ app and the maku-boot container both want port 8080.
# Stop only the app container:   docker compose --profile app stop maku-boot
# Stop everything:               docker compose --profile app down     (add -v to wipe the database)
#
# The database schema is created/migrated by Liquibase when the backend starts (either way).
services:
  mysql:
    image: mysql:8.0
    container_name: maku-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: maku_boot
      MYSQL_USER: maku
      MYSQL_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Schema + seed data are applied by Liquibase when maku-boot starts
      # (maku-server/src/main/resources/db/changelog, baseline = db/mysql-ver-english).
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: maku-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  maku-boot:
    # Only started with --profile app (or COMPOSE_PROFILES=app)
    profiles: ["app"]
    build: .
    container_name: maku-boot
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      # Remote debugging (IntelliJ: Run > Edit Configurations > + Remote JVM Debug, host localhost, port 5005)
      - "127.0.0.1:5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/maku_boot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: maku
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: "123456"
      STORAGE_LOCAL_PATH: /app/upload
      # Picked up by the JVM automatically; suspend=n so startup doesn't wait for a debugger
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - upload-data:/app/upload

volumes:
  mysql-data:
  upload-data:
