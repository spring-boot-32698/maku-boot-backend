# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true

knife4j:
  enable: false
  setting:
    custom-code: 500
    enable-footer-custom: false

# Disable springdoc, mainly for production environments
#springdoc:
#  api-docs:
#    enabled: false

spring:
  # Environment dev|test|prod
  profiles:
    active: dev
  application:
    name: maku-boot
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

storage:
  enabled: true
  config:
    # Storage type: local, aliyun, tencent, qiniu, huawei, minio
    type: local
    domain: http://localhost:8080
  local:
    path: D://upload

maku:
  xss:
    enabled: true
    exclude-urls:
      - /maku-generator/**
  security:
    # 8 hours until expiry
    access-token-expire: 28800
    # 14 days until expiry
    refresh-token-expire: 1209600

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  # Entity scanning, separate multiple packages with commas or semicolons
  typeAliasesPackage: net.maku.*.entity
  global-config:
    # Database related settings
    db-config:
      # IDAuto increment
      id-type: AUTO
      # Logical deleted value
      logic-delete-value: 1
      # Logical not-deleted value
      logic-not-delete-value: 0
    banner: false
  # Native settings
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE