spring:
  data:
    redis:
      database: 1
      host: localhost
      port: 6379
      #password:
      #timeout: 6000ms  # Connection timeout (milliseconds)
  datasource:
    dynamic:
      hikari: # Hikari Connection pool global settings
        connection-timeout: 30000     # Maximum time to wait for the connection pool to allocate a connection (milliseconds); an SQLException is thrown if no connection becomes available within this time, default: 30 seconds
        minimum-idle: 2               # Minimum idle connections
        maximum-pool-size: 10         # Maximum connections
        idle-timeout: 600000          # Maximum idle time of a connection (milliseconds); it is released (retired) on timeout, default: 10 minutes
        max-lifetime: 1800000         # Maximum lifetime of a connection (milliseconds); a connection that has timed out and is not in use is released (retired), default: 30 minutes
        connection-test-query: SELECT 1
      primary: master
      datasource:
        master:
          # MySQL8
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/maku_boot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
          username: maku
          password: 123456
  mqtt:
    host: tcp://localhost:1883
    username: maku
    password: maku
    clientId: maku_boot_service_dev
    default-topic: topic_default

# Local file storage when running from the IDE (application.yml defaults to D://upload, Windows only).
# Docker overrides it with STORAGE_LOCAL_PATH=/app/upload.
storage:
  local:
    path: ${user.home}/maku/upload
